name: CI

on:
  push:
    # The default branch is master. Watching for main here means CI never
    # runs on a push at all, silently.
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match `rust-version` in Cargo.toml.
  MSRV: "1.88.0"
  # The native dependencies every Linux job needs. `alsa-sys`, pulled in by
  # cpal, runs pkg-config at build time and panics without the headers, so
  # its absence is a build failure rather than a missing-feature warning.
  LINUX_DEPS: >-
    pkg-config libasound2-dev libdbus-1-dev libudev-dev libxcb1-dev
    libxrandr-dev

jobs:
  # The floor the crate claims. `rust-version` in Cargo.toml must not be
  # raised without also raising this, and vice versa.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $LINUX_DEPS
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup default "$MSRV"
      - run: cargo check --all-targets --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked --all-targets

  # The transport tests bind loopback sockets; a runner that blocks them
  # would look like a product failure.
  integration:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked --test replication --test transport -- --test-threads=1
      - run: cargo run --release --example simple_screen_share

  security:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
