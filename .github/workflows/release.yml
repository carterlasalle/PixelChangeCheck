name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The build floor, not the compatibility claim: iroh 1.3 requires
  # rustc 1.91, so a release built with the old 1.88 toolchain cannot
  # compile. `rust-version` in Cargo.toml stays the compatibility floor
  # it was (the crate itself needs no newer compiler); only the release
  # runners move to what the dependency tree demands.
  MSRV: "1.91.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BINARY: pcc

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No macos-13. It is GitHub's last Intel macOS image and is in
        # retirement: it sat queued for over an hour with no runner, and
        # `release` needs every matrix entry, so one unavailable label
        # blocks every release. macos-latest is Apple Silicon, and this
        # project has no x86-specific code. Intel Mac users install with
        # `cargo install` or run the arm64 build under Rosetta 2.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      # `shell: bash` on purpose: the default shell on Windows is
      # PowerShell, where "$MSRV" is a PowerShell variable and expands to
      # the empty string rather than the environment variable.
      - run: rustup toolchain install "$MSRV" --profile minimal
        shell: bash
      - run: rustup default "$MSRV"
        shell: bash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      # Archive names use the Rust target triple, not RUNNER_OS/ARCH:
      # that is the exact scheme `[package.metadata.binstall]` points
      # at, so `cargo binstall` resolves without per-target overrides.
      # The matrix only covers the three triples below (notably no
      # macOS Intel: see the matrix comment), so the mapping is exact.
      - name: Resolve target triple
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) echo "PCC_TARGET=x86_64-unknown-linux-gnu" >> "$GITHUB_ENV" ;;
            macos-latest) echo "PCC_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV" ;;
            windows-latest) echo "PCC_TARGET=x86_64-pc-windows-msvc" >> "$GITHUB_ENV" ;;
          esac
      - name: Build release binary
        run: cargo build --locked --profile dist
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="${BINARY}-${version}-${PCC_TARGET}.tar.gz"
          mkdir -p package
          cp "target/dist/${BINARY}" package/
          cp README.md package/
          if [ -f LICENSE ]; then cp LICENSE package/; fi
          tar -C package -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archive = "$env:BINARY-$version-$env:PCC_TARGET.zip"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/dist/$env:BINARY.exe" package/
          Copy-Item README.md package/
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          Compress-Archive -Path package/* -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() + "  " + $archive | Set-Content "$archive.sha256" -NoNewline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release create` resolves the repository from the git remote, so
      # this job needs a checkout even though it only touches assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; leaving it in place"
          else
            gh release create "$VERSION" release-assets/* \
              --title "$VERSION" \
              --generate-notes
          fi

  publish:
    name: Publish to crates.io
    # Only an actual tag push publishes. A manual re-run of an old tag
    # must not try to claim a version that is already taken.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # OIDC only. A crates.io API token in a repository secret is a
    # long-lived credential that anyone who can push a tag can use.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      # Publish runs on whatever stable resolves to, not the build
      # floor: publishing needs the newest compiler that can read the
      # tree, not the oldest the crate claims to support.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # A tag that disagrees with the manifest would publish a version
      # nobody can find by release, and the next one would be blocked.
      - name: The tag must match the manifest version
        run: |
          set -euo pipefail
          tagged="${RELEASE_TAG#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
      # A version cannot be reused, so publish only when this one is free.
      - name: The version must not already exist
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: pixelchangecheck-release-check' \
            "https://crates.io/api/v1/crates/pixel-change-check-client/$version")
          if [ "$code" = "200" ]; then
            echo "::error::version $version is already on crates.io"
            exit 1
          fi
          echo "version $version is free"
      # The action sets the token as a step *output*; it does not export
      # CARGO_REGISTRY_TOKEN into the environment. Without this the
      # publish step fails with "no token found".
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
