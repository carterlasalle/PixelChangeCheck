name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match `rust-version` in Cargo.toml and CI's MSRV.
  MSRV: "1.88.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BINARY: pixel-change-check-client
  # The native dependencies every Linux build needs. `alsa-sys`, which
  # cpal pulls in, runs pkg-config at build time and panics without the
  # ALSA headers, so a missing package is a build failure.
  LINUX_DEPS: >-
    pkg-config libasound2-dev libdbus-1-dev libudev-dev libxcb1-dev
    libxrandr-dev

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No macos-13. It is GitHub's last Intel macOS image and is in
        # retirement: it sat queued for over an hour with no runner, and
        # `release` needs every matrix entry, so one unavailable label
        # blocks every release. macos-latest is Apple Silicon, and this
        # project has no x86-specific code. Intel Mac users install with
        # `cargo install` or run the arm64 build under Rosetta 2.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $LINUX_DEPS
      # `shell: bash` on purpose: the default shell on Windows is
      # PowerShell, where "$MSRV" is a PowerShell variable and expands to
      # the empty string rather than the environment variable.
      - run: rustup toolchain install "$MSRV" --profile minimal
        shell: bash
      - run: rustup default "$MSRV"
        shell: bash
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="${BINARY}-${version}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          mkdir -p package
          cp "target/release/${BINARY}" package/
          cp README.md package/
          if [ -f LICENSE ]; then cp LICENSE package/; fi
          tar -C package -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archive = "$env:BINARY-$version-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/release/$env:BINARY.exe" package/
          Copy-Item README.md package/
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          Compress-Archive -Path package/* -DestinationPath $archive
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() + "  " + $archive | Set-Content "$archive.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-assets/* \
            --title "$VERSION" \
            --generate-notes

  publish:
    name: Publish to crates.io
    # Only an actual tag push publishes. A manual re-run of an old tag
    # must not try to claim a version that is already taken.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # OIDC only. A crates.io API token in a repository secret is a
    # long-lived credential that anyone who can push a tag can use.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      # A tag that disagrees with the manifest would publish a version
      # nobody can find by release, and the next one would be blocked.
      - name: The tag must match the manifest version
        run: |
          set -euo pipefail
          tagged="${RELEASE_TAG#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
      # A version cannot be reused, so publish only when this one is free.
      - name: The version must not already exist
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: pixelchangecheck-release-check' \
            "https://crates.io/api/v1/crates/pixel-change-check-client/$version")
          if [ "$code" = "200" ]; then
            echo "::error::version $version is already on crates.io"
            exit 1
          fi
          echo "version $version is free"
      # The action sets the token as a step *output*; it does not export
      # CARGO_REGISTRY_TOKEN into the environment. Without this the
      # publish step fails with "no token found".
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
