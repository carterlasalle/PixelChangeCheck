name: 'Set up Linux build dependencies'
description: >-
  Install the system libraries the crate links against on Linux. Every
  Linux job in this repository needs them; forgetting one is a build
  failure, not a degraded feature.

runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          pkg-config \
          libasound2-dev \
          libdbus-1-dev \
          libegl-dev \
          libgbm-dev \
          libpipewire-0.3-dev \
          libudev-dev \
          libwayland-dev \
          libxcb1-dev \
          libxkbcommon-dev \
          libxrandr-dev
      env:
        # Every entry above is here because a release run failed without
        # it (alsa-sys, wayland-sys, libspa-sys, khronos-egl — one dead
        # Ubuntu leg each) or the lockfile proves the probe (dbus, xcb,
        # x11 via device_query). libudev-dev, libxkbcommon-dev and
        # libxrandr-dev are kept unverified: nothing in Cargo.lock probes
        # them today, but they ride with these stacks everywhere and
        # dropping a working dep blind risks the next release. macOS and
        # Windows need none of this, which is why this is a separate step
        # and not something cargo can discover. The README prerequisites
        # table is the per-crate receipt; keep the two in sync.
        DEBIAN_FRONTEND: noninteractive
