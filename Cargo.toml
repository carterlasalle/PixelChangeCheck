[package]
name = "pixel-change-check-client"
version = "0.1.0"
edition = "2021"
# The floor CI tests. Raise this and the MSRV job together.
rust-version = "1.85"
authors = ["Carter LaSalle"]
description = "High-performance screen capture client with PCC (Pixel Change Check)"
autobenches = false

[[example]]
name = "simple_screen_share"
path = "examples/simple_screen_share.rs"

[[example]]
name = "benchmarks"
path = "benches/benchmarks.rs"

[dependencies]
# Screen capture
screenshots = "0.8.5"
display-info = "0.4.3"

# Image processing
image = { version = "0.24", features = ["jpeg", "png"] }
rgb = "0.8"
jpeg-encoder = { version = "0.5", features = ["simd"] }

# Compression
lz4_flex = "0.11"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Network
quinn = "0.10"
bytes = "1.5"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-native-certs = "0.6"
rcgen = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging and error handling
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"

# System info
num_cpus = "1.16"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Web viewer (MJPEG over plain HTTP, works from any browser incl. iPhone Safari)
tiny_http = "0.12"

# Native window viewer
minifb = "0.27"

# Relay session ids
rand = "0.8"
sha2 = "0.10"
parking_lot = "0.12"
base64 = "0.22"
sha1 = "0.10"
tokio-rustls = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
