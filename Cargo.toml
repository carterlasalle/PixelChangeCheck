[package]
name = "pixel-change-check-client"
version = "0.1.3"
edition = "2021"
# The floor CI tests. Raise this and the MSRV job together.
# 1.91, not 1.88: iroh 1.3 requires rustc 1.91, so the whole tree —
# local builds included — needs it. (1.88 was the `time`/RUSTSEC-2026-0009
# floor; iroh moved it.)
rust-version = "1.91"
authors = ["Carter LaSalle"]
# AGPL-3.0 only, not "or later": the choice is deliberate, so say it
# precisely rather than leaving a consumer to infer it.
license = "AGPL-3.0-only"
# benchmarks/benchmarks.rs is run as `cargo run --release --example
# benchmarks`, not through the bench harness. Without this, cargo
# auto-discovers it as a bench too and the same file becomes two targets.
autobenches = false
# The binary is `pcc`, which is what the README, the help text and every
# printed viewer command have always said. Cargo's default name comes from
# the package, so without this it installed as `pixel-change-check-client`
# and every documented command failed. Declaring the bin also suppresses
# the auto-discovered one, so there is exactly one binary.
autobins = false
description = "Replicates your screen exactly and sends only the pixels that changed, over QUIC or a relay, to a native or browser viewer."
repository = "https://github.com/carterlasalle/pixelchangecheck"
readme = "README.md"
keywords = ["screen-share", "remote-desktop", "quic", "pixel-diff", "streaming"]
categories = ["multimedia::video", "network-programming", "command-line-utilities"]
# Tooling that belongs to this repository's development, not to its
# consumers. Without this, `cargo publish` ships 6 MB of agent config and
# a stale status file to every downloader.

exclude = [
    "/.omp",
    "/.bughunt",
    "/.scc",
    "/.tmp",
    "/.pyre_configuration",
    "/bughunt.toml",
    "/AGENTS.md",
    "/StatusToDoComplete.md",
    "/scripts",
    "/.cargo",
    "/audit.toml",
    "/.dockerignore",
]

# `cargo binstall pixel-change-check-client` downloads the release
# archives below instead of compiling 700+ crates on the user's machine.
# The URL scheme must match the `release` job's asset names exactly;
# binstall's `{ target }` is the Rust target triple, `{ archive-suffix }`
# the extension with its leading dot. Windows uses zip, everything else
# tgz (see the per-target overrides).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pcc-{ version }-{ target }{ archive-suffix }"
bin-dir = "pcc{ binary-ext }"
pkg-fmt = "tgz"
[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"
[[bin]]
name = "pcc"
path = "src/main.rs"

[[example]]
name = "simple_screen_share"
path = "examples/simple_screen_share.rs"

[[example]]
name = "benchmarks"
path = "benches/benchmarks.rs"

# Optional platform-heavy surfaces. Both default on, so a plain
# `cargo install` behaves exactly as before; `--no-default-features`
# drops them (and the C/C++/system libraries behind them) for a
# headless relay or a minimal viewer that never opens a window.
#
# * `audio` — cpal capture/playout plus the Opus codec (and its
#   vendored cmake build of libopus when no system library is found).
# * `native-viewer` — the minifb desktop window (X11/Wayland dev
#   headers on Linux). The web viewer is always available instead.
[features]
default = ["audio", "native-viewer"]
audio = ["dep:cpal", "dep:opus"]
native-viewer = ["dep:minifb"]

[dependencies]
# Screen capture
screenshots = "0.8.5"
display-info = "0.4.3"

# Image processing
image = { version = "0.24", features = ["jpeg", "png"] }
rgb = "0.8"
jpeg-encoder = { version = "0.5", features = ["simd"] }

# Compression
lz4_flex = "0.11"

# Async runtime: the named set is what this crate uses (runtime, net,
# sync, time, io, macros for `#[tokio::main/test]`). `process`/`signal`
# still compile via iroh's tree; naming them here would change nothing.
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std"] }
async-trait = "0.1"

# Network
quinn = "0.11"
bytes = "1.5"
# The dangerous custom-verifier API is no longer feature-gated in 0.23.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rcgen = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging and error handling
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Web viewer (MJPEG over plain HTTP, works from any browser incl. iPhone Safari)
tiny_http = "0.12"

# Native window viewer
minifb = { version = "0.27", optional = true }

# Relay session ids
rand = "0.8"
sha2 = "0.10"
parking_lot = "0.12"
base64 = "0.22"
sha1 = "0.11"
tokio-rustls = "0.26"
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
tracing-appender = "0.2"
cpal = { version = "0.15", optional = true }
opus = { version = "0.4", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rand_core = "0.6"
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
hmac = "0.12"
device_query = "4.0.1"
xcap = "0.9.8"
iroh = "1"
webrtc = { version = "0.21.0", features = ["runtime-tokio"] }

# `release` is what `cargo install` (and every local dev build) pays for,
# so it optimizes for compile speed: thin LTO and 16 codegen units build
# a large multiple faster than fat LTO with one, for a low single-digit
# runtime cost this project's benches can measure before anyone commits
# to it. `dist` is what the release workflow ships: full optimization,
# paid once per release by CI instead of once per user.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
