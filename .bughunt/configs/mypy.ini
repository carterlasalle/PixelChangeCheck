# Auto-generated by BugHunt. PARANOID/MAX-RECALL profile.
[mypy]
python_version = 3.14
files = src, tests
# `src` layout plus tests-as-package means one file has two import names
# (bughunt.X vs src.bughunt.X; conftest vs tests.conftest) unless mypy
# resolves against the same roots the interpreter uses.
explicit_package_bases = True
mypy_path = src
strict = True
warn_unreachable = True
warn_unused_configs = True
strict_bytes = True
follow_imports = normal
follow_untyped_imports = True
strict_equality = True
strict_equality_for_none = True
extra_checks = True
local_partial_types = True

# `--strict` does not ban every escape hatch; these do.
disallow_any_unimported = True
disallow_any_expr = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_generics = True
disallow_subclassing_any = True

warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
warn_no_return = True
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = False
color_output = False
no_implicit_reexport = True

# Optional checks with concrete correctness value.
enable_error_code = deprecated, redundant-expr, possibly-undefined, truthy-bool, truthy-iterable, ignore-without-code, unused-awaitable, explicit-override, mutable-override, explicit-any, exhaustive-match

cache_dir = .bughunt/cache/mypy
exclude = (?x)(^|/)(\.venv|venv|node_modules|build|dist|\.bughunt/runtime|\.bughunt/cache|\.bughunt/reports|mutants)(/|$)
